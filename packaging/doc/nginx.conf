# StarDash hinter nginx mit HTTPS (z. B. /etc/nginx/sites-available/stardash)
server {
    listen 443 ssl;
    server_name stardash.firma.ch;
    ssl_certificate     /etc/ssl/certs/stardash.pem;
    ssl_certificate_key /etc/ssl/private/stardash.key;

    # Berichte der Clients bis 20 MB (wie max_upload_mb)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8470;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Metriken nur aus dem internen Netz
    location /metrics {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8470;
    }
}
