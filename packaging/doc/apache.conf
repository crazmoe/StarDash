# StarDash hinter Apache mit HTTPS
# a2enmod ssl proxy proxy_http headers
<VirtualHost *:443>
    ServerName stardash.firma.ch
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/stardash.pem
    SSLCertificateKeyFile /etc/ssl/private/stardash.key

    LimitRequestBody 26214400
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8470/
    ProxyPassReverse / http://127.0.0.1:8470/

    <Location /metrics>
        Require ip 10.0.0.0/8 192.168.0.0/16
    </Location>
</VirtualHost>
