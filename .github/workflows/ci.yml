name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ein neuer Push auf einen PR bricht dessen laufenden Build ab.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Formatierung, Clippy und Tests gegen SQLite, MariaDB und PostgreSQL
  checks:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stardash
          MARIADB_USER: stardash
          MARIADB_PASSWORD: pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stardash
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: stardash
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U stardash"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      STARDASH_TEST_MARIADB: mysql://stardash:pw@127.0.0.1:3306/stardash
      STARDASH_TEST_POSTGRES: postgres://stardash:pw@127.0.0.1:5432/stardash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Debian-Pakete für amd64 und arm64. Gebaut auf Ubuntu 22.04, damit sie
  # auch auf Debian 12 und Ubuntu 22.04 laufen (glibc 2.35).
  deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: deb-${{ matrix.arch }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # Zwischenbuilds (PR) bekommen die Laufnummer
          if [ "${{ github.event_name }}" != "push" ]; then
            DEB_VERSION="$VERSION~ci${{ github.run_number }}"
          else
            DEB_VERSION="$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB_VERSION" >> "$GITHUB_OUTPUT"
      - run: cargo deb --deb-version "${{ steps.version.outputs.deb }}" --output target/debian/
      - name: Paket testen (installieren, starten, Anfrage)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./target/debian/stardash_*.deb
          stardash --version
          sudo stardash firma-anlegen CI | grep -q '^Schlüssel:'
          sudo stardash pruefen
          sudo -u stardash stardash serve &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8470/api/v1/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8470/metrics | grep -q '^stardash_up 1'
          sudo apt-get purge -y stardash
      - uses: actions/upload-artifact@v7
        with:
          name: stardash-${{ steps.version.outputs.deb }}-${{ matrix.arch }}
          path: target/debian/*.deb

  # Auf main: Release v<Version> anlegen, sofern es noch keins gibt
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          case "$VERSION" in 0.*) echo "Vorversion $VERSION, kein Release"; exit 0;; esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon"
            exit 0
          fi
          # Abschnitt der Version aus dem CHANGELOG
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/*.deb --title "StarDash $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
